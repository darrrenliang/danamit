apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
spec:
  template:
    spec:
      containers:
      - name: restore-worker
        image: aws-psql-client:latest
        imagePullPolicy: Never
        env:
        - name: PG_HOST
          value: "poc-02.dev.svc.cluster.local"
        - name: PG_USER
          value: "postgres"
        - name: PG_DB
          value: "airflow"
        - name: AWS_ENDPOINT_URL
          value: "http://minio.dev.svc.cluster.local:9000"
        - name: BUCKET_NAME
          value: "airflow"
        - name: TARGET_DATE
          value: "2026-03-24" 
        - name: TARGET_FILE
          value: "backup-171044.sql.gz"
        - name: PGPASSWORD
          value: "postgres"
          # valueFrom:
          #   secretKeyRef:
          #     name: backup-creds
          #     key: POSTGRES_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          value: "admin"
          # valueFrom:
          #   secretKeyRef:
          #     name: backup-creds
          #     key: MINIO_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          value: "adminadmin"
          # valueFrom:
          #   secretKeyRef:
          #     name: backup-creds
          #     key: MINIO_SECRET_KEY
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Testing connection to $PG_HOST..."
          pg_isready -h $PG_HOST -p 5432 -U $PG_USER

          FULL_S3_PATH="s3://$BUCKET_NAME/$TARGET_DATE/$TARGET_FILE"
          echo "Checking if backup file exists: $FULL_S3_PATH"
          if ! aws s3 ls $FULL_S3_PATH > /dev/null 2>&1; then
            echo "Error: Backup file not found at $FULL_S3_PATH!"
            exit 1
          fi

          echo "Starting restore from $FULL_S3_PATH..."

          aws s3 cp $FULL_S3_PATH - | \
          gunzip | \
          psql -h $PG_HOST -U $PG_USER -d $PG_DB

          echo "Restore completed successfully."
      restartPolicy: Never
  backoffLimit: 1