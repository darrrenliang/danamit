# PgBouncer settings
pgbouncer:
  # Enable PgBouncer
  enabled: true
  # Number of PgBouncer replicas to run in Deployment
  replicas: 1
  # Args to use for PgBouncer(templated).
  auth_type: md5
  # Pool sizes
  metadataPoolSize: 10
  # Maximum clients that can connect to PgBouncer (higher = more file descriptors)
  maxClientConn: 100
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

config:
  scheduler:
    standalone_dag_processor: "True"
    dag_dir_list_interval: 5
    min_file_process_interval: 0
    parsing_processes: 4
      